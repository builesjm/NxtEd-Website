<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/nxted-design-system-32cc21cb-5435-4521-b0c7-567ed7be3b38/tokens/colors.css">
  <link rel="stylesheet" href="_ds/nxted-design-system-32cc21cb-5435-4521-b0c7-567ed7be3b38/tokens/typography.css">
  <link rel="stylesheet" href="_ds/nxted-design-system-32cc21cb-5435-4521-b0c7-567ed7be3b38/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/nxted-design-system-32cc21cb-5435-4521-b0c7-567ed7be3b38/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/nxted-design-system-32cc21cb-5435-4521-b0c7-567ed7be3b38/styles.css">
  <script src="_ds/nxted-design-system-32cc21cb-5435-4521-b0c7-567ed7be3b38/_ds_bundle.js"></script>
  <style>
    /* Fixed, not sticky: the nav has no bar of its own — no background, no
       border, no reserved row in the page's flow. It floats directly on
       whatever the page's first section paints behind it, and z-index:50
       keeps it above everything as the page scrolls. Every page's first
       section adds matching top clearance (.nx-nav-clear) so real content
       doesn't start out hidden underneath it. */
    .nx-nav{position:fixed;top:0;left:0;right:0;z-index:50;background:transparent;
      transition:opacity .2s ease;}
    /* The nav only exists at the very top, floating over the hero. Scroll
       past it and it disappears entirely rather than turning into a bar —
       there's no persistent header on this site. */
    .nx-nav.nx-scrolled{opacity:0;pointer-events:none;}
    /* Must match .nx-wrap on the pages exactly, or the logo drifts out of line
       with the headline below it. Same max-width, same padding, same box model. */
    .nx-nav-inner{position:relative;box-sizing:border-box;max-width:1640px;margin:0 auto;padding:8px clamp(20px,3.2vw,44px);display:flex;align-items:center;justify-content:space-between;gap:16px;}
    .nx-logo{display:flex;align-items:center;text-decoration:none;flex:none;}
    .nx-logo img{height:64px;display:block;}
    .nx-links{display:flex;align-items:center;gap:clamp(14px,2.5vw,26px);}
    .nx-link{font-family:var(--font-display);font-weight:600;font-size:14px;text-decoration:none;transition:color .15s ease;}
    .nx-link:hover{color:var(--accent-text);}
    .nx-burger{display:none;flex:none;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border:1px solid var(--border-hairline);border-radius:12px;background:var(--color-white);color:var(--color-espresso);font-size:19px;line-height:1;cursor:pointer;}
    .nx-burger:hover{border-color:var(--accent-text);color:var(--accent-text);}

    @media (max-width:820px){
      /* Padding stays on the .nx-wrap value so the logo keeps sharing a left
         edge with the headline below it. A separate mobile value drifted 2px. */
      /* Smaller on phones — 80px would eat a quarter of a short viewport in a
         sticky bar — but still well above the 62px legibility floor. */
      .nx-logo img{height:52px;}
      .nx-burger{display:inline-flex;}
      .nx-links{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;gap:0;
        background:var(--color-white);border-bottom:1px solid var(--border-hairline);
        padding:6px clamp(20px,3.2vw,44px) 18px;box-shadow:var(--shadow-card);}
      .nx-links.nx-open{display:flex;}
      .nx-link{padding:14px 2px;border-bottom:1px solid var(--border-hairline);font-size:16px;}
      .nx-cta{margin-top:14px;}
      .nx-cta a,.nx-cta button{width:100%;box-sizing:border-box;}
    }
  </style>
</helmet>
<div class="nx-nav {{ scrolledClass }}">
  <div class="nx-nav-inner">
    <a class="nx-logo" href="Home.dc.html">
      <!-- Full lockup, TUTORING included. It sets at ~5px tall here, which holds
           because the letters are tracked so wide — measured at nav size, 12 of
           its 13 stems still resolve as separate strokes, and it doubles on any
           retina screen. The height below is what keeps it readable; don't drop
           it back down without re-checking that line. -->
      <img src="assets/nxted-logo.svg" alt="NxtEd Tutoring">
    </a>
    <button class="nx-burger" type="button" onClick="{{ toggle }}" aria-label="{{ menuLabel }}" aria-expanded="{{ expanded }}" aria-controls="nx-primary-nav">{{ burgerGlyph }}</button>
    <div class="nx-links {{ openClass }}" id="nx-primary-nav">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
        <a class="nx-link" href="{{ l.href }}" style="color:{{ l.color }};" aria-current="{{ l.current }}">{{ l.label }}</a>
      </sc-for>
      <span class="nx-cta">
        <x-import component-from-global-scope="NxtEdDesignSystem_32cc21.Button" href="Contact.dc.html" hint-size="auto,44px">Book a free session</x-import>
      </span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;subjects&quot;,&quot;tutors&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false, scrolled: false };

  componentDidMount() {
    // The nav only lives at the very top, floating over the hero. Past
    // ~40px of scroll it fades out entirely rather than turning solid.
    this.onScroll = () => {
      const scrolled = window.scrollY > 40;
      if (scrolled !== this.state.scrolled) this.setState({ scrolled });
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.onScroll();
  }

  componentWillUnmount() {
    window.removeEventListener('scroll', this.onScroll);
  }

  renderVals() {
    const a = this.props.active ?? '';
    const open = this.state.open;
    const items = [
      ['about', 'About', 'About.dc.html'],
      ['subjects', 'Subjects', 'Subjects.dc.html'],
      ['tutors', 'Tutors', 'Tutors.dc.html']
    ];
    return {
      openClass: open ? 'nx-open' : '',
      scrolledClass: this.state.scrolled ? 'nx-scrolled' : '',
      expanded: open ? 'true' : 'false',
      burgerGlyph: open ? '✕' : '☰',
      menuLabel: open ? 'Close menu' : 'Open menu',
      toggle: () => this.setState({ open: !this.state.open }),
      links: items.map(([id, label, href]) => ({
        label, href,
        color: id === a ? 'var(--accent-text)' : 'var(--color-espresso)',
        current: id === a ? 'page' : undefined
      }))
    };
  }
}
</script>
</body>
</html>

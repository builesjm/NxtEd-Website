<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/nxted-design-system-32cc21cb-5435-4521-b0c7-567ed7be3b38/tokens/colors.css">
  <link rel="stylesheet" href="_ds/nxted-design-system-32cc21cb-5435-4521-b0c7-567ed7be3b38/tokens/typography.css">
  <link rel="stylesheet" href="_ds/nxted-design-system-32cc21cb-5435-4521-b0c7-567ed7be3b38/tokens/spacing.css">

</helmet>
<!-- Horizontal padding lives on the inner element, not here, so the footer
     lines up with the nav logo and the page headlines on one shared grid. -->
<div style="background:var(--color-espresso);padding:clamp(34px,4vw,52px) 0 28px;">
  <div style="box-sizing:border-box;max-width:1640px;margin:0 auto;padding:0 clamp(20px,3.2vw,44px);display:flex;flex-direction:column;gap:26px;">
    <div style="display:flex;justify-content:space-between;gap:40px;flex-wrap:wrap;align-items:flex-start;">
      <div style="display:flex;flex-direction:column;gap:12px;max-width:340px;">
        <!-- The real lockup, reversed for the dark ground — this used to be the
             wordmark rebuilt in Montserrat, which didn't match the actual logo. -->
        <img src="assets/nxted-logo-light.svg" alt="NxtEd Tutoring" style="width:190px;height:auto;display:block;">
        <div style="font-family:var(--font-body);font-size:15.5px;line-height:1.6;color:var(--text-inverse-muted);">Personalized tutoring by accomplished students.</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div style="font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-inverse-muted);">Explore</div>
        <div style="display:flex;flex-direction:column;gap:9px;">
          <a href="/about" style="font-family:var(--font-display);font-weight:600;font-size:14px;text-decoration:none;color:#fff;" style-hover="color:var(--color-marigold-600);">About</a>
          <a href="/subjects" style="font-family:var(--font-display);font-weight:600;font-size:14px;text-decoration:none;color:#fff;" style-hover="color:var(--color-marigold-600);">Subjects &amp; Grades</a>
          <a href="/tutors" style="font-family:var(--font-display);font-weight:600;font-size:14px;text-decoration:none;color:#fff;" style-hover="color:var(--color-marigold-600);">Meet the Tutors</a>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div style="font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-inverse-muted);">Get in touch</div>
        <div style="display:flex;flex-direction:column;gap:9px;">
          <a href="tel:+12263889789" style="font-family:var(--font-display);font-weight:600;font-size:14px;text-decoration:none;color:#fff;" style-hover="color:var(--color-marigold-600);">(226) 388-9789</a>
          <a href="mailto:nxt.ed.tutors@gmail.com" style="font-family:var(--font-display);font-weight:600;font-size:14px;text-decoration:none;color:#fff;" style-hover="color:var(--color-marigold-600);">nxt.ed.tutors@gmail.com</a>
          <a href="/contact" style="font-family:var(--font-display);font-weight:600;font-size:14px;text-decoration:none;color:var(--color-marigold-600);" style-hover="color:var(--color-marigold-hover);">Book a free intro session</a>
        </div>
      </div>
    </div>
    <div style="border-top:1px solid var(--border-inverse);padding-top:20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-family:var(--font-display);font-weight:600;font-size:12.5px;color:var(--text-inverse-muted);">
      <span>© 2026 NxtEd Tutoring</span>
      <span>The first session is always free</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:320}}"></script>
</body>
</html>
